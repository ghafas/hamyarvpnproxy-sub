name: Update HamyarVPNProxy subscriptions

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build subscriptions
        run: python src/build_subscriptions.py
      - name: Install Sing-box for real tunnel tests
        run: curl -fsSL https://sing-box.app/install.sh | sh
      - name: Test real tunnel and download speed
        run: python src/test_download_speed.py
        env:
          TEST_PER_PROTOCOL: "5"
          SPEED_SAMPLES: "3"
          SPEED_TEST_BYTES: "1500000"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
